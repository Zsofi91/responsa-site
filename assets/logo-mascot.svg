<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" role="img"
     aria-labelledby="respTitle">
  <title id="respTitle">The Responsa mascot: a caped speech bubble holding hearts</title>
  <defs>
    <linearGradient id="body" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%"  stop-color="#2E9BE0"/>
      <stop offset="45%" stop-color="#4FB84A"/>
      <stop offset="100%" stop-color="#7DC832"/>
    </linearGradient>
    <linearGradient id="cape" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#E8483A"/>
      <stop offset="100%" stop-color="#C8281C"/>
    </linearGradient>
    <linearGradient id="tail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#3FA9DC"/>
      <stop offset="100%" stop-color="#2E8BC8"/>
    </linearGradient>
    <linearGradient id="heart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#FF7A72"/>
      <stop offset="100%" stop-color="#E8434A"/>
    </linearGradient>
  </defs>

  <g fill="none" stroke="#1B3A4B" stroke-width="7"
     stroke-linecap="round" stroke-linejoin="round">

    <!-- cape, swept left and behind the body -->
    <path d="M118 132 C 84 150, 52 176, 36 200 C 68 196, 92 200, 112 210
             C 118 186, 122 156, 118 132 Z" fill="url(#cape)"/>
    <path d="M150 196 C 140 214, 128 232, 120 244 C 140 240, 156 232, 168 220 Z"
          fill="url(#tail)"/>

    <!-- speech-bubble body -->
    <rect x="104" y="46" width="228" height="150" rx="62" fill="url(#body)"/>
    <!-- inner face plate -->
    <rect x="128" y="66" width="180" height="110" rx="48" fill="#FFFFFF"/>

    <!-- bubble tail -->
    <path d="M186 172 C 184 206, 176 228, 162 246 C 194 234, 216 208, 224 178 Z"
          fill="url(#tail)"/>

    <!-- eyes -->
    <g stroke="none">
      <ellipse cx="186" cy="112" rx="15" ry="17" fill="#12232E"/>
      <ellipse cx="252" cy="112" rx="15" ry="17" fill="#12232E"/>
      <circle cx="191" cy="105" r="5" fill="#FFFFFF"/>
      <circle cx="257" cy="105" r="5" fill="#FFFFFF"/>
      <!-- cheeks -->
      <ellipse cx="160" cy="138" rx="13" ry="8" fill="#F9C6CB" opacity=".85"/>
      <ellipse cx="278" cy="138" rx="13" ry="8" fill="#F9C6CB" opacity=".85"/>
    </g>

    <!-- open smile -->
    <path d="M204 134 C 210 150, 228 150, 234 134 Z" fill="#E8434A" stroke-width="6"/>

    <!-- gloved hands -->
    <path d="M150 168 c -14 -4 -26 4 -26 16 c 0 12 12 20 24 16 c 8 -3 12 -10 12 -18 Z"
          fill="#FFFFFF"/>
    <path d="M310 176 c 14 -4 26 4 26 16 c 0 12 -12 20 -24 16 c -8 -3 -12 -10 -12 -18 Z"
          fill="#FFFFFF"/>

    <!-- hearts -->
    <path d="M330 128 c -10 -12 -30 -6 -30 10 c 0 14 18 26 30 34 c 12 -8 30 -20 30 -34
             c 0 -16 -20 -22 -30 -10 Z" fill="url(#heart)"/>
    <path d="M300 158 c -8 -10 -24 -5 -24 8 c 0 11 14 21 24 27 c 10 -6 24 -16 24 -27
             c 0 -13 -16 -18 -24 -8 Z" fill="url(#heart)"/>
  </g>

  <!-- sparkles -->
  <g fill="#FFC63F">
    <path d="M222 14 l 7 16 l 17 7 l -17 7 l -7 16 l -7 -16 l -17 -7 l 17 -7 Z"/>
    <path d="M172 34 l 4 9 l 9 4 l -9 4 l -4 9 l -4 -9 l -9 -4 l 9 -4 Z" opacity=".9"/>
    <path d="M268 36 l 4 8 l 8 4 l -8 4 l -4 8 l -4 -8 l -8 -4 l 8 -4 Z" opacity=".9"/>
    <path d="M74 176 l 3 7 l 7 3 l -7 3 l -3 7 l -3 -7 l -7 -3 l 7 -3 Z" opacity=".75"/>
    <path d="M356 196 l 3 7 l 7 3 l -7 3 l -3 7 l -3 -7 l -7 -3 l 7 -3 Z" opacity=".75"/>
  </g>
</svg>
